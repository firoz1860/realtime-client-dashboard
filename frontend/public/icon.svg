<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Orbit">
  <title>Orbit</title>
  <!--
    The orbit brand mark: rounded-square badge with the brand gradient and a
    filled Sparkles glyph, matching .brand-mark in app/globals.css and the
    <Sparkles fill="currentColor" /> used in app/page.tsx.
    Glyph geometry: lucide-react v1.17.0 "sparkles" (ISC).
  -->
  <defs>
    <linearGradient id="orbitMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#786bff" />
      <stop offset="1" stop-color="#37d3c0" />
    </linearGradient>
  </defs>

  <!-- badge: rx/size ratio 0.30 mirrors border-radius 9px on a 30px mark -->
  <rect width="64" height="64" rx="19" fill="url(#orbitMark)" />

  <!-- glyph occupies ~55% of the badge, as size={16} does inside a 30px mark -->
  <g transform="translate(14.4 14.4) scale(1.4667)"
     fill="#ffffff" stroke="#ffffff" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z" />
    <path d="M20 2v4" />
    <path d="M22 4h-4" />
    <circle cx="4" cy="20" r="2" />
  </g>
</svg>
